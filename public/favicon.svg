<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#0369A1"/>
  <!-- Comb body (Pente = fine-tooth comb for inspection) -->
  <rect x="6" y="8" width="20" height="4" rx="1" fill="#F1F5F9"/>
  <!-- Teeth -->
  <rect x="7" y="12" width="2" height="11" rx="0.5" fill="#F1F5F9"/>
  <rect x="11" y="12" width="2" height="13" rx="0.5" fill="#F1F5F9"/>
  <rect x="15" y="12" width="2" height="11" rx="0.5" fill="#F1F5F9"/>
  <rect x="19" y="12" width="2" height="13" rx="0.5" fill="#F1F5F9"/>
  <rect x="23" y="12" width="2" height="11" rx="0.5" fill="#F1F5F9"/>
  <!-- Inspection dot (accent) -->
  <circle cx="20" cy="20" r="2.5" fill="#0369A1" stroke="#7DD3FC" stroke-width="1"/>
</svg>
